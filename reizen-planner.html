<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reisplanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">🌍 ReisDagboek</div>
        <ul class="nav-links">
            <li><a href="index.html">Alle Reizen</a></li>
            <li><a href="planner.html" class="active">Reisplanner</a></li>
        </ul>
    </nav>

    <header>
        <h1>Mijn Reisplanner 📝</h1>
        <p>Aankomende trips, planningen en inpaklijsten.</p>
    </header>

    <main class="container">
        <section class="planner-grid">
            <div class="planner-box">
                <h2>Geplande Trips ✈️</h2>
                <ul class="plan-list">
                    <li><strong>Italië (Roadtrip)</strong> - Mei 2026</li>
                    <li><strong>IJsland (Rondreis)</strong> - September 2026</li>
                </ul>
            </div>

            <div class="planner-box">
                <h2>Inpaklijst Check 🎒</h2>
                <ul class="checklist">
                    <li><input type="checkbox"> Paspoort & Documenten</li>
                    <li><input type="checkbox"> Camera + Oplader</li>
                    <li><input type="checkbox"> Wereldstekker</li>
                </ul>
            </div>
        </section>
    </main>

</body>
</html>
